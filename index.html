<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Weather App</h1>
      <form id="weather-form">
        <input id="city-input" type="text" placeholder="Enter your city" />
        <button>Search</button>
      </form>
      <p id="message">Search for a city to see its weather</p>
      <div id="weather-card" class="weather-card">
        <h2 id="city-name"></h2>
        <h3 id="temp"></h3>
        <p id="condition"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
