<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Weather App</h1>
      <form>
        <input type="text" placeholder="Enter your city" />
        <button>Search</button>
      </form>
      <p>Search for a city to see its weather</p>
      <div id="weather-card" class="weather-card">
        <h2 id="city-name">Dhaka</h2>
        <h3 id="temp">30</h3>
        <p id="condition">Windy</p>
        <p id="humidity">12</p>
        <p id="wind">1641</p>
      </div>
    </div>
  </body>
</html>
